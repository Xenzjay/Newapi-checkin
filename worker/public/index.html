<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11110f">
  <title>Check Console · NewAPI 签到控制台</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #11110f;
      --paper: #1a1a17;
      --paper-2: #22221e;
      --line: #34342e;
      --line-bright: #4a4a40;
      --text: #f2efe5;
      --muted: #9e9b8f;
      --signal: #d7ff64;
      --signal-ink: #182000;
      --good: #7de2ad;
      --bad: #ff7d6e;
      --warn: #f4c95d;
      --field: #121210;
      --inset: #151512;
      --grid-line: rgba(215, 255, 100, .025);
      --brand-shadow: #3a431b;
      --button-hover: #e3ff8a;
      --toast-shadow: rgba(0, 0, 0, .25);
      --signal-soft: rgba(215, 255, 100, .035);
      --focus-ring: rgba(215, 255, 100, .08);
      --row-hover: rgba(215, 255, 100, .025);
      --table-head: rgba(255, 255, 255, .012);
      --story-mark: rgba(215, 255, 100, .045);
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --ink: #f5f7fa;
      --paper: #ffffff;
      --paper-2: #eef2f5;
      --line: #d8dee6;
      --line-bright: #aeb8c4;
      --text: #17202a;
      --muted: #5f6b78;
      --signal: #2856c6;
      --signal-ink: #ffffff;
      --good: #1f8a62;
      --bad: #c74040;
      --warn: #a66b00;
      --field: #f7f9fb;
      --inset: #f1f4f7;
      --grid-line: rgba(40, 86, 198, .07);
      --brand-shadow: #aebbd2;
      --button-hover: #3c68d2;
      --toast-shadow: rgba(17, 24, 39, .18);
      --signal-soft: rgba(40, 86, 198, .05);
      --focus-ring: rgba(40, 86, 198, .14);
      --row-hover: rgba(40, 86, 198, .045);
      --table-head: rgba(23, 32, 42, .025);
      --story-mark: rgba(40, 86, 198, .06);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--ink); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font: 15px/1.55 var(--sans);
      background:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        var(--ink);
      background-size: 32px 32px;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }
    code, .mono { font-family: var(--mono); }

    .shell { width: min(1240px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 64px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--signal-ink);
      background: var(--signal);
      border-radius: 4px;
      font: 800 18px/1 var(--mono);
      box-shadow: 5px 5px 0 var(--brand-shadow);
    }
    .brand strong { display: block; font-size: 15px; letter-spacing: .02em; }
    .brand small { color: var(--muted); font: 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .12em; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .live { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font: 12px var(--mono); }
    .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 4px rgba(125, 226, 173, .1); }

    .hero { display: grid; grid-template-columns: 1.5fr .8fr; gap: 24px; padding: 48px 0 28px; }
    .kicker { color: var(--signal); font: 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .hero h1 { max-width: 760px; margin-top: 9px; font-size: clamp(34px, 6vw, 68px); line-height: .98; letter-spacing: -.055em; }
    .hero-copy { max-width: 650px; margin-top: 18px; color: var(--muted); font-size: 16px; }
    .run-meta { align-self: end; padding: 18px; border-left: 2px solid var(--signal); background: var(--signal-soft); }
    .run-meta span { display: block; color: var(--muted); font: 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .run-meta strong { display: block; margin-top: 6px; font: 14px var(--mono); }

    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; overflow: hidden; border: 1px solid var(--line); background: var(--line); }
    .metric { min-height: 128px; padding: 20px; background: var(--paper); }
    .metric-label { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .metric-index { color: var(--line-bright); }
    .metric strong { display: block; margin-top: 18px; font: 600 clamp(30px, 4vw, 44px)/1 var(--mono); }
    .metric strong.good { color: var(--good); }
    .metric strong.bad { color: var(--bad); }

    .setup { margin-top: 16px; border: 1px solid var(--line); background: var(--paper); }
    .setup-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px 18px; border-bottom: 1px solid var(--line); }
    .setup-head h2 { font-size: 15px; }
    .setup-head p { color: var(--muted); font-size: 12px; }
    .setup-grid { display: grid; grid-template-columns: repeat(4, 1fr); }
    .setup-step { min-height: 154px; padding: 18px; border-right: 1px solid var(--line); }
    .setup-step:last-child { border-right: 0; }
    .setup-number { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font: 10px var(--mono); letter-spacing: .08em; }
    .setup-check { color: var(--warn); }
    .setup-step.done .setup-check { color: var(--good); }
    .setup-step h3 { margin-top: 22px; font-size: 14px; }
    .setup-step p { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .setup-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }

    .workspace { display: grid; grid-template-columns: minmax(330px, .82fr) minmax(0, 1.5fr); gap: 16px; margin-top: 16px; }
    .stack { display: grid; gap: 16px; align-content: start; }
    .panel { border: 1px solid var(--line); background: var(--paper); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px 18px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { font-size: 15px; letter-spacing: .01em; }
    .panel-head span { color: var(--muted); font: 11px var(--mono); }
    .panel-body { padding: 18px; }

    .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: auto; }
    .field label { color: var(--muted); font: 11px var(--mono); letter-spacing: .05em; text-transform: uppercase; }
    .field-help { color: #77746b; font-size: 11px; }
    .field-control-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
   input {
     width: 100%;
     padding: 11px 12px;
     color: var(--text);
     background: var(--field);
     border: 1px solid var(--line);
     border-radius: 2px;
     outline: none;
     transition: border-color .18s, box-shadow .18s;
   }
    select { width: 100%; min-height: 40px; padding: 9px 12px; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 2px; outline: none; }
    select:focus { border-color: var(--signal); box-shadow: 0 0 0 3px var(--focus-ring); }
    input:focus { border-color: var(--signal); box-shadow: 0 0 0 3px var(--focus-ring); }
    input::placeholder { color: #66645c; }
    textarea { width: 100%; min-height: 96px; padding: 11px 12px; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 2px; outline: none; resize: vertical; font: 12px/1.45 var(--mono); }
    textarea:focus { border-color: var(--signal); box-shadow: 0 0 0 3px var(--focus-ring); }
    textarea::placeholder { color: #66645c; }
    .config-import { margin-bottom: 16px; padding: 12px; border: 1px solid var(--line); background: var(--inset); }
    .config-import-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
    .config-import-head strong { font-size: 13px; }
    .config-import-head span { color: var(--muted); font: 10px var(--mono); letter-spacing: .06em; }
    .config-import-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .config-import-actions > .button { flex: 1 1 150px; }
    .config-import-status { min-height: 18px; margin-top: 7px; color: var(--muted); font-size: 11px; }
    .config-import-status.good { color: var(--good); }
    .config-import-status.bad { color: var(--bad); }
    .form-note { margin-top: 12px; color: var(--muted); font-size: 12px; }
    .input-guide { margin-top: 14px; border: 1px solid var(--line); background: var(--inset); }
    .input-guide summary { padding: 11px 12px; cursor: pointer; color: var(--signal); font: 11px var(--mono); letter-spacing: .04em; }
    .guide-content { display: grid; gap: 12px; padding: 0 12px 13px; color: var(--muted); font-size: 12px; }
    .guide-content strong { color: var(--text); }
    .guide-content ol { margin: 0; padding-left: 20px; }
    .guide-content li + li { margin-top: 5px; }
    .guide-content code { color: var(--signal); }

    .button {
      min-height: 40px;
      padding: 9px 14px;
      border: 1px solid var(--signal);
      border-radius: 2px;
      color: var(--signal-ink);
      background: var(--signal);
      font-weight: 750;
      transition: transform .15s, background .15s;
    }
    .button:hover { transform: translateY(-1px); background: var(--button-hover); }
    .button:active { transform: translateY(0); }
    .button.secondary { color: var(--text); background: transparent; border-color: var(--line-bright); font-weight: 600; }
    .button.secondary:hover { background: var(--paper-2); }
    .button.small { min-height: 32px; padding: 5px 10px; font-size: 12px; }
    .form-submit { width: 100%; margin-top: 14px; }
    .form-buttons { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 14px; }
    .form-buttons .form-submit { margin-top: 0; }
    .automation-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, .8fr); gap: 24px; }
    .schedule-form { display: grid; gap: 12px; align-content: start; }
    .schedule-enabled { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
    .schedule-enabled input { width: 17px; height: 17px; accent-color: var(--signal); }
    .schedule-meta { color: var(--muted); font: 11px var(--mono); }
    .automation-run { display: grid; align-content: start; gap: 10px; padding-left: 24px; border-left: 1px solid var(--line); }
    .automation-run h3 { font-size: 14px; }
    .automation-run p { color: var(--muted); font-size: 12px; }
    .automation-status { min-height: 18px; color: var(--muted); font-size: 12px; }
    .automation-status.good { color: var(--good); }
    .automation-status.bad { color: var(--bad); }
    [hidden] { display: none !important; }

    .security-list { display: grid; gap: 12px; }
    .security-item { display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
    .security-code { color: var(--signal); font: 11px var(--mono); }
    .security-item strong { display: block; font-size: 13px; }
    .security-item p { color: var(--muted); font-size: 12px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); background: var(--table-head); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    tbody tr { transition: background .15s; }
    tbody tr:hover { background: var(--row-hover); }
    tbody tr:last-child td { border-bottom: 0; }
    .account-name { font-weight: 700; }
    .account-url, .account-message { display: block; max-width: 360px; overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .account-url { margin-top: 2px; font-family: var(--mono); }
    .account-message { margin-top: 5px; }
    .account-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 6px; }
    .account-group { color: var(--signal); font: 11px var(--mono); }
    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { display: inline-flex; align-items: center; min-height: 20px; padding: 2px 6px; color: var(--text); background: var(--paper-2); border: 1px solid var(--line-bright); border-radius: 2px; font: 10px var(--mono); }
    .account-filters { display: grid; grid-template-columns: minmax(170px, .7fr) minmax(200px, 1fr) auto; gap: 8px; align-items: end; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--inset); }
    .account-filters .field { gap: 4px; }
    .account-filters .field label { font-size: 10px; }
    .filter-status { color: var(--muted); font: 11px var(--mono); white-space: nowrap; }
    .account-actions { display: grid; grid-template-columns: repeat(2, minmax(92px, 1fr)); align-items: stretch; gap: 6px; min-width: 210px; }
    .account-actions .button { width: 100%; }
    .status { display: inline-flex; align-items: center; gap: 7px; font: 12px var(--mono); }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
    .status.good { color: var(--good); }
    .status.good::before { background: var(--good); }
    .status.bad { color: var(--bad); }
    .status.bad::before { background: var(--bad); }
    .status.off { color: var(--muted); }
    .status.off::before { background: var(--line-bright); }
    .fail-count { color: var(--muted); font: 12px var(--mono); }
    .empty { padding: 48px 20px; text-align: center; color: var(--muted); }
    .empty strong { display: block; margin-bottom: 4px; color: var(--text); }
    .run-row { cursor: pointer; }
    .run-time { font-family: var(--mono); font-size: 12px; }
    .number-good { color: var(--good); font-family: var(--mono); }
    .number-bad { color: var(--bad); font-family: var(--mono); }

    .modal-root { position: relative; z-index: 30; }
    .modal-backdrop { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(10, 12, 14, .68); }
    .modal { width: min(760px, 100%); max-height: min(720px, calc(100vh - 48px)); overflow: auto; border: 1px solid var(--line-bright); background: var(--paper); box-shadow: 14px 14px 0 rgba(0, 0, 0, .22); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { font-size: 17px; }
    .modal-head p { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .modal-close { flex: 0 0 auto; min-width: 34px; }
    .modal-body { padding: 20px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; border: 1px solid var(--line); background: var(--line); }
    .detail-item { min-width: 0; padding: 13px 14px; background: var(--paper); }
    .detail-item.full { grid-column: 1 / -1; }
    .detail-label { display: block; color: var(--muted); font: 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    .detail-value { display: block; margin-top: 5px; overflow-wrap: anywhere; }
    .detail-value.good { color: var(--good); }
    .detail-value.bad { color: var(--bad); }
    .detail-value.muted { color: var(--muted); }
    .modal-table-wrap { margin-top: 16px; overflow-x: auto; border: 1px solid var(--line); }
    .modal-table th, .modal-table td { padding: 12px; }
    .modal-table .result-site { min-width: 150px; }
    .modal-table .result-message { min-width: 220px; max-width: 360px; white-space: normal; overflow-wrap: anywhere; }
    .modal-empty { padding: 28px 12px; color: var(--muted); text-align: center; }
    .modal-note { margin-top: 14px; color: var(--muted); font-size: 12px; }
    .logs-list { display: grid; gap: 1px; margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); background: var(--line); }
    .log-item { display: grid; grid-template-columns: 92px 86px minmax(0, 1fr); gap: 12px; padding: 11px 13px; background: var(--paper); font-size: 12px; }
    .log-time, .log-category { color: var(--muted); font: 11px var(--mono); }
    .log-level { font: 11px var(--mono); text-transform: uppercase; }
    .log-level.info { color: var(--good); }
    .log-level.warn { color: var(--warn); }
    .log-level.error { color: var(--bad); }
    .logs-empty { padding: 24px 12px; color: var(--muted); text-align: center; }

    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 20; max-width: min(380px, calc(100% - 48px)); padding: 13px 16px; color: var(--ink); background: var(--signal); border-radius: 3px; font-weight: 700; box-shadow: 10px 10px 0 var(--toast-shadow); transform: translateY(120px); opacity: 0; transition: .22s ease; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { color: #fff; background: var(--bad); }

    .login-page { min-height: 100vh; display: grid; grid-template-columns: 1.1fr .9fr; }
    .login-story { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh; padding: clamp(30px, 6vw, 76px); overflow: hidden; border-right: 1px solid var(--line); }
    .login-story::after { content: "CHECK"; position: absolute; right: -30px; bottom: -90px; color: var(--story-mark); font: 900 clamp(140px, 28vw, 420px)/1 var(--mono); letter-spacing: -.12em; pointer-events: none; }
    .login-story h1 { max-width: 780px; font-size: clamp(48px, 8vw, 112px); line-height: .86; letter-spacing: -.075em; }
    .login-story h1 em { color: var(--signal); font-style: normal; }
    .login-story-copy { position: relative; z-index: 1; max-width: 620px; color: var(--muted); font-size: 16px; }
    .login-box { position: relative; display: grid; place-items: center; padding: 32px; background: var(--paper); }
    .login-theme-toggle { position: absolute; top: 24px; right: 24px; }
    .login-card { width: min(420px, 100%); }
    .login-card h2 { margin-top: 13px; font-size: 30px; letter-spacing: -.03em; }
    .login-card > p { margin-top: 9px; color: var(--muted); }
    .login-form { margin-top: 28px; }
    .login-form .button { width: 100%; margin-top: 12px; }
    .login-facts { display: grid; gap: 10px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
    .login-fact { display: grid; grid-template-columns: 62px 1fr; gap: 12px; color: var(--muted); font-size: 12px; }
    .login-fact code { color: var(--signal); }
    .login-error { min-height: 22px; margin-top: 10px; color: var(--bad); font-size: 13px; }
    .loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); font: 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; }

    @media (max-width: 960px) {
      .hero { grid-template-columns: 1fr; }
      .run-meta { align-self: auto; }
      .workspace { grid-template-columns: 1fr; }
      .setup-grid { grid-template-columns: 1fr 1fr; }
      .setup-step:nth-child(2) { border-right: 0; }
      .setup-step:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .login-page { grid-template-columns: 1fr; }
      .login-story { min-height: 44vh; border-right: 0; border-bottom: 1px solid var(--line); }
      .login-box { min-height: 56vh; }
    }
    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, 1240px); padding-top: 16px; }
      .topbar { align-items: flex-start; }
      .live { display: none; }
      .hero { padding-top: 34px; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .metric { min-height: 108px; }
      .form-grid { grid-template-columns: 1fr; }
      .setup-grid { grid-template-columns: 1fr; }
      .setup-step { min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .setup-step:nth-child(2) { border-right: 0; }
      .setup-step:last-child { border-bottom: 0; }
      .field.full { grid-column: auto; }
      th, td { padding: 12px; }
      .login-story { padding: 34px 24px; }
      .login-box { padding: 34px 24px; }
      .modal-backdrop { padding: 12px; }
      .modal-body { padding: 14px; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-item.full { grid-column: auto; }
      .automation-grid { grid-template-columns: 1fr; }
      .automation-run { padding-left: 0; padding-top: 18px; border-top: 1px solid var(--line); border-left: 0; }
      .field-control-row { grid-template-columns: 1fr; }
      .account-filters { grid-template-columns: 1fr; align-items: stretch; }
      .filter-status { white-space: normal; }
      .log-item { grid-template-columns: 1fr; gap: 3px; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root" class="modal-root"></div>
  <script>
    const app = document.querySelector('#app');
    const toastNode = document.querySelector('#toast');
    const modalRoot = document.querySelector('#modal-root');
    const tokenKey = 'check_console_token';
    const expiryKey = 'check_console_expiry';
    const themeKey = 'check_console_theme';

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[character]);

    const token = () => localStorage.getItem(tokenKey);

    function currentTheme() {
      return localStorage.getItem(themeKey) === 'light' ? 'light' : 'dark';
    }

    function applyTheme(theme) {
      const nextTheme = theme === 'light' ? 'light' : 'dark';
      document.documentElement.dataset.theme = nextTheme;
      document.querySelectorAll('[data-theme-toggle]').forEach((button) => {
        button.textContent = nextTheme === 'dark' ? '切换日间' : '切换夜间';
        button.setAttribute('aria-pressed', String(nextTheme === 'light'));
      });
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', nextTheme === 'dark' ? '#11110f' : '#f5f7fa');
    }

    function toggleTheme() {
      const nextTheme = currentTheme() === 'dark' ? 'light' : 'dark';
      localStorage.setItem(themeKey, nextTheme);
      applyTheme(nextTheme);
    }

    function clearSession() {
      localStorage.removeItem(tokenKey);
      localStorage.removeItem(expiryKey);
    }

    function formatTime(value) {
      if (!value) return '尚未运行';
      const date = new Date(value.includes('T') ? value : value.replace(' ', 'T') + '+08:00');
      if (Number.isNaN(date.getTime())) return value;
      return new Intl.DateTimeFormat('zh-CN', {
        month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false,
      }).format(date);
    }

    function showToast(message, isError = false) {
      toastNode.textContent = message;
      toastNode.className = `toast show${isError ? ' error' : ''}`;
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => { toastNode.className = 'toast'; }, 2600);
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          'content-type': 'application/json',
          ...(token() ? { authorization: `Bearer ${token()}` } : {}),
          ...(options.headers || {}),
        },
      });
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) {
        clearSession();
        renderLogin('登录状态已过期，请重新登录。');
        throw new Error('登录状态已过期');
      }
      if (!response.ok) throw new Error(data.error || '请求失败');
      return data;
    }

    function closeModal() {
      modalRoot.innerHTML = '';
      document.removeEventListener('keydown', handleModalKeydown);
    }

    function handleModalKeydown(event) {
      if (event.key === 'Escape') closeModal();
    }

    function openModal(content) {
      modalRoot.innerHTML = `<div class="modal-backdrop" data-modal-backdrop><section class="modal" role="dialog" aria-modal="true">${content}</section></div>`;
      modalRoot.querySelector('[data-modal-backdrop]').addEventListener('click', (event) => {
        if (event.target === event.currentTarget) closeModal();
      });
      modalRoot.querySelector('.modal-close')?.addEventListener('click', closeModal);
      document.addEventListener('keydown', handleModalKeydown);
      modalRoot.querySelector('.modal-close')?.focus();
    }

    function formatQuota(value) {
      if (value === null || value === undefined || value === '') return '未提供';
      const number = Number(value);
      if (!Number.isFinite(number)) return String(value);
      return `${number.toLocaleString('zh-CN')} tokens`;
    }

    function resultStatus(result) {

    function openSiteLogin(value) {
      let siteUrl;
      try {
        siteUrl = new URL(String(value || '').trim());
      } catch {
        throw new Error('请先填写有效的站点地址。');
      }
      if (!['http:', 'https:'].includes(siteUrl.protocol) || siteUrl.username || siteUrl.password) {
        throw new Error('站点地址必须是有效的 HTTP 或 HTTPS 地址。');
      }
      siteUrl.search = '';
      siteUrl.hash = '';
      const link = document.createElement('a');
      link.href = siteUrl.href;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.click();
      return siteUrl.href;
    }

    function logDetails(log) {
      let details;
      try {
        details = JSON.parse(log.details || '{}');
      } catch {
        return '';
      }
      if (!details || typeof details !== 'object' || Array.isArray(details)) return '';
      return Object.entries(details)
        .filter(([key]) => !/(session|clearance|token|secret|password|credential|encryption)/i.test(key))
        .map(([key, value]) => {
          const display = typeof value === 'object' ? JSON.stringify(value) : String(value);
          return `${key}: ${display}`;
        })
        .join(' · ');
    }

      list.innerHTML = logs.map((log) => {

        const details = logDetails(log);
        return `<li class="log-item">
          <span class="log-time">${escapeHtml(formatTime(log.created_at))}</span>
          <span class="log-level ${level}">${escapeHtml(log.category || level)}</span>

      const groups = [...new Set(accounts.map((account) => account.group_name).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
      groupSelect.innerHTML = '<option value="">全部分组</option>' + groups.map((group) => '<option value="' + escapeHtml(group) + '">' + escapeHtml(group) + '</option>').join('');
      const apply = () => {
        const group = groupSelect.value;
        const tag = tagInput.value.trim().toLowerCase();
        let visible = 0;
        document.querySelectorAll('[data-account-row]').forEach((cell) => {
          const matchesGroup = !group || cell.dataset.group === group;
          const matchesTag = !tag || (cell.dataset.tags || '').toLowerCase().split('|').some((item) => item.includes(tag));
          const row = cell.closest('tr');
          const shown = matchesGroup && matchesTag;
          if (row) row.hidden = !shown;
          if (shown) visible += 1;
        });
        status.textContent = '显示 ' + visible + ' / ' + accounts.length + ' 个账号';

      tagInput.addEventListener('input', apply);
    }

                        <div class="field"><label for="group-name">分组</label><input id="group-name" name="group_name" maxlength="80" placeholder="例如：主站 / 生产环境"><span class="field-help">用于归类同一站点的多个账号，或按使用场景区分。</span></div>
                        <div class="field"><label for="tags">标签</label><input id="tags" name="tags" placeholder="例如：生产，高额度，个人"><span class="field-help">多个标签用逗号分隔，最多 20 个。</span></div>
                        <div class="field"><label for="url">站点地址</label><div class="field-control-row"><input id="url" name="url" type="url" placeholder="https://api.example.com/console" required><button id="open-site-login" class="button secondary small" type="button">打开站点登录</button></div><span class="field-help">可填写站点根地址或带 /console 的登录页。保存时 Worker 使用站点 Origin 进行签到；登录后用浏览器扩展或油猴脚本导入 Cookie。</span></div>
                        <div class="field full"><label for="session">Session Cookie</label><input id="session" name="session" type="password" placeholder="只粘贴 session 的值" required><span class="field-help">粘贴 Cookie 中 session= 后面的值，不包含 session= 和分号。</span></div>
                        <div class="field full"><label for="clearance">cf_clearance</label><input id="clearance" name="cf_clearance" type="password" placeholder="通常留空"><span class="field-help">只有站点受 Cloudflare 挑战保护且自动回退失败时才需要。</span></div>
                      </div>
                      <details class="input-guide">
                        <summary>如何从浏览器获取 Session Cookie</summary>
                        <div class="guide-content">
                          <ol>
                            <li>在目标 NewAPI 站点完成登录。</li>
                            <li>按 F12 打开开发者工具，进入 Application 或 应用 标签。</li>
                            <li>依次打开 Storage -> Cookies -> 当前站点域名。</li>
                            <li>找到名称为 <code>session</code> 的 Cookie，复制 Value 列完整内容。</li>
                            <li>回到本表单，只粘贴 Value；无需填写 <code>session=</code>。</li>
                          </ol>
                          <p><strong>用户 ID：</strong>必须填写。打开 F12 → Network，筛选 Fetch/XHR，复制请求头 <code>new-api-user</code> 的值。Session Cookie 内的内容无法可靠推导这个值。</p>
                          <p><strong>cf_clearance：</strong>获取方式与 session 相同，在 Cookies 列表复制同名 Cookie 的 Value。</p>
                        </div>
                      </details>
                      <p class="form-note">保存后 Worker 加密写入 D1，控制台查询接口不会返回 Session 或密文。</p>
                      <div class="form-buttons">
                        <button class="button form-submit" type="submit">加密保存账号</button>
                        <button class="button secondary" type="button" id="cancel-edit" hidden>取消更新</button>
                      </div>
                    </form>
                  </div>
                </article>

                <article class="panel">
                  <div class="panel-head"><h2>安全边界</h2><span>${healthyAccounts}/${accounts.filter((a) => a.enabled).length} HEALTHY</span></div>
                  <div class="panel-body security-list">
                    <div class="security-item"><span class="security-code">01</span><div><strong>浏览器会话</strong><p>默认 24 小时，到期后只需重新登录控制台。</p></div></div>
                    <div class="security-item"><span class="security-code">02</span><div><strong>Runner Token</strong><p>GitHub Actions 独立使用，不受浏览器会话过期影响。</p></div></div>
                    <div class="security-item"><span class="security-code">03</span><div><strong>账号密文</strong><p>AES-GCM 加密后写入绑定名为 Check 的 D1。</p></div></div>
                  </div>
                </article>
              </div>

              <div class="stack">
                <article class="panel">
                  <div class="panel-head"><h2>账号健康状态</h2><span>${accounts.length} ACCOUNTS</span></div>
                  <div class="account-filters">
                    <div class="field"><label for="account-filter-group">分组筛选</label><select id="account-filter-group"><option value="">全部分组</option></select></div>
                    <div class="field"><label for="account-filter-tag">标签筛选</label><input id="account-filter-tag" placeholder="输入一个标签，例如：生产"></div>
                    <span id="filter-status" class="filter-status">显示全部账号</span>
                  </div>
                  <div class="table-wrap">
                    ${accounts.length ? `
                      <table>
                        <thead><tr><th>账号 / 站点</th><th>状态</th><th>连续失败</th><th>最近更新</th><th>操作</th></tr></thead>
                        <tbody>${accounts.map((account) => {
                          const status = accountStatus(account);
                          return `<tr>
                            <td data-account-row data-group="${escapeHtml(account.group_name || '')}" data-tags="${escapeHtml((account.tags || []).join('|'))}"><span class="account-name">${escapeHtml(account.name)}</span><span class="account-url">${escapeHtml(account.url)}</span><span class="account-message" title="${escapeHtml(account.last_message || '')}">${escapeHtml(account.last_message || '尚无签到结果')}</span><span class="account-meta">${account.group_name ? `<span class="account-group">${escapeHtml(account.group_name)}</span>` : ''}<span class="tag-list">${(account.tags || []).map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}</span></span></td>
                            <td><span class="status ${status.className}">${status.label}</span></td>
                            <td><span class="fail-count">${account.failure_count || 0}</span></td>
                            <td><span class="run-time">${formatTime(account.last_checkin_at)}</span></td>
                            <td><div class="account-actions"><button class="button secondary small account-login" type="button" data-url="${escapeHtml(account.login_url || account.url)}">登录</button><button class="button secondary small account-view" type="button" data-id="${account.id}">查看</button><button class="button secondary small account-edit" type="button" data-id="${account.id}">更新凭据</button><button class="button secondary small account-toggle" type="button" data-id="${account.id}" data-enabled="${account.enabled}">${account.enabled ? '停用' : '启用'}</button><button class="button secondary small account-delete" type="button" data-id="${account.id}">删除</button></div></td>
                          </tr>`;
                        }).join('')}</tbody>
                      </table>` : '<div class="empty"><strong>还没有签到账号</strong>使用左侧表单添加第一个账号。</div>'}
                  </div>
                </article>

                <article class="panel">
                  <div class="panel-head"><h2>操作日志</h2><span>LAST 100 EVENTS</span></div>
                  <div class="panel-body"><ul id="logs-list" class="logs-list"><li class="logs-empty">正在读取操作日志...</li></ul></div>
                </article>

                <article class="panel">
                  <div class="panel-head"><h2>运行历史</h2><span>LAST 30 RUNS</span></div>
                  <div class="table-wrap">
                    ${runs.length ? `
                      <table>
                        <thead><tr><th>执行时间</th><th>成功</th><th>失败</th><th>总数</th><th>详情</th></tr></thead>
                        <tbody>${runs.map((run) => `<tr><td><span class="run-time">${escapeHtml(run.execution_time)}</span></td><td class="number-good">${escapeHtml(run.success_count)}</td><td class="number-bad">${escapeHtml(run.fail_count)}</td><td class="mono">${escapeHtml(run.total)}</td><td><button class="button secondary small run-view" type="button" data-run-id="${escapeHtml(run.id)}">查看</button></td></tr>`).join('')}</tbody>
                      </table>` : '<div class="empty"><strong>等待第一次运行</strong>手动触发 GitHub Actions 后，结果会出现在这里。</div>'}
                  </div>
                </article>
              </div>
            </section>
          </div>`;

        document.querySelector('#logout').addEventListener('click', async () => {
          try {
            await api('/api/auth/logout', { method: 'POST' });
          } catch {
            // Local cleanup still completes when the session already expired.
          } finally {
            clearSession();
            renderLogin();
          }
        });

        applyTheme(currentTheme());
        document.querySelector('#theme-toggle').addEventListener('click', toggleTheme);
        setupAccountFilters(accounts);

        document.querySelector('#schedule-enabled').checked = Boolean(schedule.enabled);
        document.querySelector('#schedule-time').value = schedule.time || '08:10';
        const scheduleStatus = document.querySelector('#schedule-status');
        scheduleStatus.textContent = scheduleData.github_ready
          ? `已加载：${schedule.enabled ? '启用' : '停用'}，每天 ${schedule.time}（${schedule.timezone}）`
          : '尚未配置 GitHub Actions 触发凭据，请先在 Worker Variables 中添加 GITHUB_REPOSITORY 和 GITHUB_ACTIONS_TOKEN。';
        renderLogs(logs);

        document.querySelector('#schedule-form').addEventListener('submit', async (event) => {
          event.preventDefault();
          const button = event.currentTarget.querySelector('button[type="submit"]');
          button.disabled = true;
          button.textContent = '正在保存...';
          try {
            const data = await api('/api/dashboard/schedule', {
              method: 'PATCH',
              body: JSON.stringify({
                enabled: document.querySelector('#schedule-enabled').checked,
                time: document.querySelector('#schedule-time').value,
                timezone: 'Asia/Shanghai',
              }),
            });
            const saved = data.schedule || schedule;
            scheduleStatus.textContent = `已保存：${saved.enabled ? '启用' : '停用'}，每天 ${saved.time}（${saved.timezone}）`;
            showToast('自动签到计划已保存');
            const refreshedLogs = await api('/api/dashboard/logs');
            renderLogs(refreshedLogs.logs || []);
          } catch (error) {
            scheduleStatus.textContent = error.message;
            showToast(error.message, true);
          } finally {
            button.disabled = false;
            button.textContent = '保存自动签到计划';
          }
        });

        document.querySelector('#run-checkin-now').addEventListener('click', async (event) => {
          const button = event.currentTarget;
          button.disabled = true;
          button.textContent = '正在触发...';
          setAutomationStatus('正在请求 GitHub Actions...', '');
          try {
            const data = await api('/api/dashboard/checkin', { method: 'POST' });
            setAutomationStatus(data.status === 'queued' ? '已触发，等待 Actions 执行完成。' : '已提交签到任务。', 'good');
            showToast('已触发 GitHub Actions 签到');
            const refreshedLogs = await api('/api/dashboard/logs');
            renderLogs(refreshedLogs.logs || []);
          } catch (error) {
            setAutomationStatus(error.message, 'bad');
            showToast(error.message, true);
          } finally {
            button.disabled = false;
            button.textContent = '立即运行签到';
          }
        });

        document.querySelector('#open-site-login').addEventListener('click', () => {
          try {
            const openedUrl = openSiteLogin(document.querySelector('#url').value);
            showToast(`已打开登录页面：${openedUrl}`);
          } catch (error) {
            showToast(error.message, true);
          }
        });

        document.querySelector('#url').addEventListener('blur', (event) => {
          const nameInput = document.querySelector('#name');
          if (nameInput.value.trim()) return;
          try {
            const siteUrl = new URL(event.currentTarget.value.trim());
            if (['http:', 'https:'].includes(siteUrl.protocol)) {
              nameInput.value = siteUrl.hostname.replace(/^www[.]/i, '');
            }
          } catch {
            // URL validation remains handled by the form and Worker API.
          }
        });

        document.querySelectorAll('.account-login').forEach((button) => {
          button.addEventListener('click', () => {
            try {
              const openedUrl = openSiteLogin(button.dataset.url);
              showToast(`已打开登录页面：${openedUrl}`);
            } catch (error) {
              showToast(error.message, true);
            }
          });
        });

        document.querySelector('#open-account-import').addEventListener('click', () => {
          const importPanel = document.querySelector('.config-import');
          importPanel?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          document.querySelector('#account-import')?.focus({ preventScroll: true });
        });

        document.querySelector('#copy-worker-url').addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(location.origin);
            showToast(`已复制 Worker 地址：${location.origin}`);
          } catch {
            showToast(`Worker 地址：${location.origin}`);
          }
        });

        function setImportStatus(message, type = '') {
          const node = document.querySelector('#account-import-status');
          node.textContent = message;
          node.className = 'config-import-status ' + type;
        }

        function applyImportedConfig(raw) {
          let config;
          try {
            config = JSON.parse(raw);
          } catch {
            throw new Error('配置不是有效的 JSON。');
          }

          const form = document.querySelector('#account-form');
          const siteUrl = String(config.siteUrl || config.site_url || config.url || '').trim();
          const userId = String(config.userId || config.user_id || '').trim();
          const session = String(config.session || config.sessionCookie || config.session_cookie || '').trim();
          const cfClearance = String(config.cfClearance || config.cf_clearance || '').trim();
          const groupName = String(config.groupName || config.group_name || '').trim();
          const tags = Array.isArray(config.tags) ? config.tags.join(', ') : String(config.tags || '').trim();
          let name = String(config.name || '').trim();

          if (!siteUrl || !userId || !session) {
            throw new Error('配置缺少站点地址、用户 ID 或 Session。');
          }
          if (!siteUrl.startsWith('http://') && !siteUrl.startsWith('https://')) {
            throw new Error('站点地址必须以 http:// 或 https:// 开头。');
          }
          if (!name) name = new URL(siteUrl).hostname.replace(/^www[.]/i, '');

          form.elements.name.value = name;
          form.elements.user_id.value = userId;
          form.elements.group_name.value = groupName;
          form.elements.tags.value = tags;
          form.elements.url.value = siteUrl.endsWith('/') ? siteUrl.slice(0, -1) : siteUrl;
          form.elements.session.value = session;
          form.elements.cf_clearance.value = cfClearance;
          setImportStatus('已导入并填充表单，请确认内容后点击“加密保存账号”。', 'good');
        }

        document.querySelector('#import-account-config').addEventListener('click', async () => {
          try {
            const raw = await navigator.clipboard.readText();
            if (!raw.trim()) throw new Error('剪贴板为空。');
            document.querySelector('#account-import').value = raw;
            applyImportedConfig(raw);
          } catch (error) {
            setImportStatus(error.message || '无法读取剪贴板，请直接粘贴 JSON。', 'bad');
          }
        });

        document.querySelector('#account-import').addEventListener('paste', () => {
          window.setTimeout(() => {
            try {
              applyImportedConfig(document.querySelector('#account-import').value.trim());
            } catch (error) {
              setImportStatus(error.message || '导入失败，请检查 JSON。', 'bad');
            }
          }, 0);
        });

        document.querySelector('#clear-account-import').addEventListener('click', () => {
          document.querySelector('#account-import').value = '';
          setImportStatus('已清空导入文本。');
        });

        document.querySelector('#account-form').addEventListener('submit', async (event) => {
          event.preventDefault();
          const button = event.currentTarget.querySelector('button[type="submit"]');
          const payload = Object.fromEntries(new FormData(event.currentTarget));
          const accountId = payload.account_id;
          delete payload.account_id;
          Object.keys(payload).forEach((field) => {
            const keepEmptyMetadata = accountId && ['group_name', 'tags'].includes(field);
            if (!payload[field] && !keepEmptyMetadata) delete payload[field];
          });
          button.disabled = true;
          button.textContent = '正在加密保存...';
          try {
            await api(accountId ? `/api/dashboard/accounts/${accountId}` : '/api/dashboard/accounts', {
              method: accountId ? 'PATCH' : 'POST',
              body: JSON.stringify(payload),
            });
            showToast(accountId ? '账号凭据已更新' : '账号已加密保存');
            await renderDashboard();
          } catch (error) {
            button.disabled = false;
            button.textContent = '加密保存账号';
            showToast(error.message, true);
          }
        });

        document.querySelectorAll('.account-view').forEach((button) => {
          button.addEventListener('click', () => showAccountDetail(button.dataset.id));
        });

        document.querySelectorAll('.account-edit').forEach((button) => {
          button.addEventListener('click', async () => {
            try {
              const data = await api(`/api/dashboard/accounts/${button.dataset.id}`);
              const account = data.account;
              const form = document.querySelector('#account-form');
              form.elements.account_id.value = account.id;
              form.elements.name.value = account.name || '';
              form.elements.user_id.value = account.user_id || '';
              form.elements.group_name.value = account.group_name || '';
              form.elements.tags.value = (account.tags || []).join(', ');
              form.elements.url.value = account.login_url || account.url || '';
              form.elements.session.value = '';
              form.elements.session.required = false;
              form.elements.cf_clearance.value = '';
              form.querySelector('button[type="submit"]').textContent = '加密更新凭据';
              document.querySelector('#cancel-edit').hidden = false;
              form.scrollIntoView({ behavior: 'smooth', block: 'center' });
              form.elements.session.focus({ preventScroll: true });
            } catch (error) {
              showToast(error.message, true);
            }
          });
        });

        document.querySelector('#cancel-edit').addEventListener('click', () => {
          const form = document.querySelector('#account-form');
          form.reset();
          form.elements.account_id.value = '';
          form.elements.session.required = true;
          form.querySelector('button[type="submit"]').textContent = '加密保存账号';
          document.querySelector('#cancel-edit').hidden = true;
        });

        document.querySelectorAll('.account-toggle').forEach((button) => {
          button.addEventListener('click', async () => {
            try {
              await api(`/api/dashboard/accounts/${button.dataset.id}`, {
                method: 'PATCH',
                body: JSON.stringify({ enabled: button.dataset.enabled !== 'true' }),
              });
              showToast(button.dataset.enabled === 'true' ? '账号已停用' : '账号已启用');
              await renderDashboard();
            } catch (error) {
              showToast(error.message, true);
            }
          });
        });

        document.querySelectorAll('.account-delete').forEach((button) => {
          button.addEventListener('click', async () => {
            if (!window.confirm('确定删除这个账号凭据吗？删除后将无法恢复，但运行历史会保留。')) return;
            try {
              await api(`/api/dashboard/accounts/${button.dataset.id}`, { method: 'DELETE' });
              showToast('账号凭据已删除');
              await renderDashboard();
            } catch (error) {
              showToast(error.message, true);
            }
          });
        });

        document.querySelectorAll('.run-view').forEach((button) => {
          button.addEventListener('click', () => showRun(button.dataset.runId));
        });
      } catch (error) {
        if (error.message !== '登录状态已过期') {
          app.innerHTML = `<div class="loading">${escapeHtml(error.message)}</div>`;
        }
      }
    }

    applyTheme(currentTheme());
    if (token() && (!expiry() || new Date(expiry()).getTime() > Date.now())) {
      renderDashboard();
    } else {
      clearSession();
      renderLogin();
    }
  </script>
</body>
</html>
